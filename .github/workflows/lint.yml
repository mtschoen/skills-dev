name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: DavidAnson/markdownlint-cli2-action@v23

  validate-skills:
    # Validate every skill's SKILL.md with the official Agent Skills validator
    # (agentskills, from the pinned skills-ref package). Catches strict-YAML
    # parse failures (apostrophe-in-single-quote, flattened block scalar) plus
    # the spec's naming/field rules. Needs submodules checked out.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install skills-ref==0.1.1 pytest==8.3.4 pyyaml==6.0.3
      - name: Validate every skill with agentskills
        run: python scripts/validate_skills.py
      - name: Check per-submodule markdownlint/CI config drift
        run: python scripts/check_config_drift.py
      - name: Run unit test suite
        run: pytest tests/test_validate_skills.py

  coverage:
    # Measures umbrella Python line coverage (scripts/ and ci/) and posts it
    # as the pr-crew/coverage commit status that pr-crew's coverage gate reads
    # on the default branch (status contract: pr-crew docs/coverage-gate.md).
    # ci/post-coverage-status.py is vendored from schoen/pr-crew's ci/ dir
    # (ruff-formatted and adapted to this repo's workflow outcome contract).
    # The post step runs `if: always()` so a red suite reports state=error
    # (gate reads 'unreadable') instead of leaving no status at all.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub's default GITHUB_TOKEN is read-only, so posting a commit status
    # needs `statuses: write` explicitly there. Gitea Actions has no `statuses`
    # scope (GitHub-only per docs.gitea.com/usage/actions/token-permissions),
    # so that line is silently dropped on Gitea - but Gitea DOES parse and
    # enforce the rest of this block, replacing its default read+write token
    # mode with only what's listed. Gitea's commit-status POST route requires
    # write access to the Code unit (reqRepoWriter(unit.TypeCode) in
    # go-gitea/gitea routers/api/v1/api.go), which `contents: write` maps to
    # (services/actions/token_permission_design.md). `contents: read` here
    # left that unit read-only on Gitea and made every status post 403.
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install skills-ref==0.1.1 pytest==8.3.4 pytest-cov==6.2.1 pyyaml==6.0.3
      - name: Run full test suite with coverage
        id: coverage
        run: pytest tests/ scripts/ ci/ --cov=scripts --cov=ci --cov-report=term-missing --cov-report=json:coverage.json
      - name: Post coverage status
        if: always()
        env:
          COVERAGE_STEP_OUTCOME: ${{ steps.coverage.outcome }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/post-coverage-status.py

  ruff:
    # Lint + format-check umbrella-owned Python only (scripts/, tests/, ci/). Each
    # skill submodule owns its own gate, so submodules are not checked out and
    # the paths are scoped explicitly (config: pyproject.toml). Zero findings
    # is the bar - see TEST-REPORT.md.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install ruff==0.15.15
      - name: ruff check
        run: ruff check scripts/ tests/ ci/
      - name: ruff format --check
        run: ruff format --check scripts/ tests/ ci/

  shellcheck:
    # Lint umbrella-owned shell scripts only (submodule hooks own their gates).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck scripts/*.sh install-skills.sh tests/test-install.sh
      # The suite was shellchecked but never executed, so installer regressions
      # could only be caught by hand. The .bat half self-skips without cmd.exe.
      - name: install integration test
        run: bash tests/test-install.sh

  aislop:
    # AI-slop / code-quality / security gate over umbrella-owned code, plus a
    # redundant format check. Scope + threshold (score 100) come from
    # .aislop/config.yml. The gate runs the fork build (mtschoen/aislop,
    # branch schoen/main: C#/roslynator + newer rules), installed straight
    # from GitHub; npm builds it on install. aislop's format engine is
    # enabled as a belt-and-suspenders pass: the fork prefers the PATH ruff
    # over its vendored copy, so we install the SAME pinned ruff the
    # dedicated ruff job uses and aislop formats identically. `aislop ci`
    # exits non-zero below threshold.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pinned ruff (so aislop's format pass matches CI's ruff job)
        run: pip install ruff==0.15.15
      - name: Install the aislop fork build
        # Pinned to a commit SHA of the fork's schoen/main so the gate cannot
        # drift under us; bump the SHA deliberately after new fork commits
        # (git ls-remote https://github.com/mtschoen/aislop.git schoen/main).
        # Built from an explicit clone: npm's git-dep prepare flow cannot run
        # the fork's tsdown build (devDep missing in the temp clone), but a
        # normal install in a real checkout can, and the packed tarball then
        # installs globally without rebuilding.
        run: |
          git clone https://github.com/mtschoen/aislop.git "$RUNNER_TEMP/aislop"
          git -C "$RUNNER_TEMP/aislop" checkout 4d87a844407cf348ec3265e8f5dfe97c614041d2
          cd "$RUNNER_TEMP/aislop"
          npm install
          npm pack
          npm install -g ./aislop-*.tgz
      - name: aislop ci (score 100 gate)
        run: aislop ci
