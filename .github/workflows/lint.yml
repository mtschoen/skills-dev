name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: DavidAnson/markdownlint-cli2-action@v23

  validate-skills:
    # Validate every skill's SKILL.md with the official Agent Skills validator
    # (agentskills, from the pinned skills-ref package). Catches strict-YAML
    # parse failures (apostrophe-in-single-quote, flattened block scalar) plus
    # the spec's naming/field rules. Needs submodules checked out.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install skills-ref==0.1.1 pytest==8.3.4 pyyaml==6.0.3
      - name: Validate every skill with agentskills
        run: python scripts/validate_skills.py
      - name: Check per-submodule markdownlint/CI config drift
        run: python scripts/check_config_drift.py
      - name: Run unit test suite
        run: pytest tests/test_validate_skills.py

  coverage:
    # Measures umbrella Python line coverage (scripts/ and ci/) and posts it
    # as the pr-crew/coverage commit status that pr-crew's coverage gate reads
    # on the default branch (status contract: pr-crew docs/coverage-gate.md).
    # ci/post-coverage-status.py is vendored from schoen/pr-crew's ci/ dir
    # (ruff-formatted and adapted to this repo's workflow outcome contract).
    # The post step runs `if: always()` so a red suite reports state=error
    # (gate reads 'unreadable') instead of leaving no status at all.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub's default GITHUB_TOKEN is read-only, so posting a commit status
    # needs `statuses: write` explicitly there. Gitea Actions has no `statuses`
    # scope (GitHub-only per docs.gitea.com/usage/actions/token-permissions),
    # so that line is silently dropped on Gitea - but Gitea DOES parse and
    # enforce the rest of this block, replacing its default read+write token
    # mode with only what's listed. Gitea's commit-status POST route requires
    # write access to the Code unit (reqRepoWriter(unit.TypeCode) in
    # go-gitea/gitea routers/api/v1/api.go), which `contents: write` maps to
    # (services/actions/token_permission_design.md). `contents: read` here
    # left that unit read-only on Gitea and made every status post 403.
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install skills-ref==0.1.1 pytest==8.3.4 pytest-cov==6.2.1 pyyaml==6.0.3
      - name: Run full test suite with coverage
        id: coverage
        run: pytest tests/ scripts/ ci/ --cov=scripts --cov=ci --cov-report=term-missing --cov-report=json:coverage.json
      - name: Post coverage status
        if: always()
        env:
          COVERAGE_STEP_OUTCOME: ${{ steps.coverage.outcome }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/post-coverage-status.py

  ruff:
    # Lint + format-check umbrella-owned Python only (scripts/, tests/, ci/). Each
    # skill submodule owns its own gate, so submodules are not checked out and
    # the paths are scoped explicitly (config: pyproject.toml). Zero findings
    # is the bar - see TEST-REPORT.md.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install ruff==0.15.15
      - name: ruff check
        run: ruff check scripts/ tests/ ci/
      - name: ruff format --check
        run: ruff format --check scripts/ tests/ ci/

  shellcheck:
    # Lint umbrella-owned shell scripts only (submodule hooks own their gates).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck scripts/*.sh install-skills.sh tests/test-install.sh
      # The suite was shellchecked but never executed, so installer regressions
      # could only be caught by hand. The .bat half self-skips without cmd.exe;
      # install-test-windows below is what covers it.
      - name: install integration test
        run: bash tests/test-install.sh

  install-test-windows:
    # tests/test-install.sh gates its .bat half on cmd.exe being present, so the
    # ubuntu run above silently exercises only the .sh half. Everything
    # Windows-specific - robocopy mirroring, the git-diff drift comparison, and
    # hook registration (which resolves the home from USERPROFILE, not HOME) -
    # was therefore never covered by CI, and three of those assertions had
    # rotted into failures or vacuous passes before this job existed.
    #
    # This also covers the other half of one branch: install-skills.sh prefers
    # rsync and falls back to `cp -a`. The ubuntu runner has rsync; Git Bash on
    # Windows does not, so the fallback is only ever exercised here.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Git for Windows is installed on the runner host (C:\Program Files\Git),
      # but only its cmd\ directory is in the default PATH. Add Git's bin\ and
      # usr\bin\ to GITHUB_PATH so subsequent steps can invoke `shell: bash`
      # and bash scripts have access to MSYS utilities (cygpath, diff, grep, etc.).
      - name: Add Git Bash to PATH
        shell: pwsh
        run: |
          $gitDir = "C:\Program Files\Git"
          if (-not (Test-Path "$gitDir\bin\bash.exe")) {
            $gitCmd = Get-Command git -ErrorAction SilentlyContinue
            if ($gitCmd) {
              $gitDir = (Get-Item $gitCmd.Source).Directory.Parent.FullName
            }
          }
          "$gitDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$gitDir\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # No actions/setup-python here on purpose. The self-hosted windows-latest
      # runners provision python through the fleet's own ensure-python.ps1 (an
      # archive extract into C:\hostedtoolcache\python-current, on the runner
      # PATH), so python is already available with no setup step. setup-python's
      # install fallback runs CPython's installer with InstallAllUsers=1, which
      # needs elevation the non-admin gitea-runner service account does not have,
      # so it dies at setup.ps1:131 on any tool-cache miss (schoen-lab#2182). The
      # green runs before then were cache hits, not a working install path.
      # The hook-registration assertions need python on PATH; without it the
      # installer prints "--hooks: skipped" and those assertions fail with no
      # hint as to why. Fail here instead, with the reason.
      - name: verify python is on PATH
        shell: bash
        run: command -v python || command -v python3
      - name: install integration test (both installers, including CRLF parity)
        shell: bash
        run: |
          command -v cmd.exe
          command -v cygpath
          command -v robocopy.exe
          bash tests/test-install.sh

  aislop:
    # Score-100 gate over umbrella-owned code; scope and engines come from
    # .aislop/config.yml. The revision in .aislop/fork-commit is built outside
    # the workspace using its frozen pnpm lockfile; prepare produces dist/.
    # Run the CLI directly, without a global install. Match the dedicated
    # ruff job's pin so both format passes use the same formatter.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pinned ruff (so aislop's format pass matches CI's ruff job)
        run: pip install ruff==0.15.15
      - name: Read aislop fork pin
        shell: bash
        run: |
          commit="$(< .aislop/fork-commit)"
          commit="${commit#"${commit%%[![:space:]]*}"}"
          commit="${commit%"${commit##*[![:space:]]}"}"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid .aislop/fork-commit: expected one lowercase 40-hex SHA" >&2
            exit 1
          fi
          echo "AISLOP_FORK_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Install the aislop fork build
        shell: bash
        run: |
          repository="$GITHUB_SERVER_URL/schoen/aislop.git"
          if [[ "$GITHUB_SERVER_URL" == "https://github.com" ]]; then
            repository="https://github.com/mtschoen/aislop.git"
          fi
          git clone "$repository" "$RUNNER_TEMP/aislop"
          git -C "$RUNNER_TEMP/aislop" checkout "$AISLOP_FORK_COMMIT"
          npx -y pnpm@10.28.0 --dir "$RUNNER_TEMP/aislop" install --frozen-lockfile
      - name: aislop ci (score 100 gate)
        shell: bash
        run: node "$RUNNER_TEMP/aislop/dist/cli.js" ci .
